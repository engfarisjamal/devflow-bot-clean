version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: devflow-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/devflow.db
    volumes:
      - ../data:/app/data
    networks:
      - devflow-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  bot:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: devflow-bot
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - DATABASE_URL=sqlite+aiosqlite:///./data/devflow.db
    volumes:
      - ../data:/app/data
    networks:
      - devflow-network
    command: ["python", "scripts/run_bot.py"]

networks:
  devflow-network:
    driver: bridge
