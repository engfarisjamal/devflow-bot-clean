[tool.poetry]
name = "devflow-bot"
version = "0.1.0"
description = "Autonomous Developer Workflow Bot"
authors = ["Eng Faris Jamal <engfarisjamal@users.noreply.github.com>"]
license = "MIT"
readme = "README.md"
packages = [{ include = "devflow_bot", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "*"
uvicorn = { extras = ["standard"], version = "*" }
pydantic = "*"
pydantic-settings = "*"
sqlalchemy = { extras = ["asyncio"], version = "*" }
alembic = "*"
asyncpg = "*"
aiosqlite = "*"
greenlet = "*"
python-telegram-bot = "*"
httpx = "*"
redis = "*"
celery = "*"
sentry-sdk = "*"
structlog = "*"

[tool.poetry.group.dev.dependencies]
pytest = "*"
pytest-asyncio = "*"
pytest-cov = "*"
ruff = "*"
black = "*"
mypy = "*"
pre-commit = "*"
faker = "*"
factory-boy = "*"
mkdocs = "*"
mkdocs-material = "*"
poethepoet = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501", "B008", "BLE001", "S112"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*" = ["S101"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
check_untyped_defs = false
no_implicit_optional = false
strict_optional = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src"]
omit = ["*/tests/*", "*/migrations/*"]
